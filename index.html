<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Jasphine Productivity Centre</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    /* Added touch-action manipulation to prevent zoom gestures on mobile */
    html, body { width: 100%; height: 100%; overflow: hidden; background: #F1EFE8; touch-action: manipulation; }
    iframe {
      width: 100%; height: 100vh;
      border: none; display: block;
    }
  </style>
</head>
<body>
  
  <iframe
    src="https://script.google.com/macros/s/AKfycbxPXGwXL_lW-Abhi68nW2lbN-BfaqZFyBQQR9YDYibr1tQ2fuc2VqQwlY0xWm_IzqI/exec"
    allow="clipboard-write"
    title="Jasphine Productivity Centre">
  </iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          })
          .catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
      });
    }
  </script>
</body>
</html>
